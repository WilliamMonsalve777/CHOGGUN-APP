<style>
/* ================= CHOGGUN — estilos ================= */
:root{
  --gold:#f5b942; --gold2:#ffcc33; --red:#e04848; --red2:#c43a3a; --teal:#1f3d4a;
  --cream:#fffcf3; --green:#3fb37f; --blue:#5ab8e8; --purple:#9b7cf0;
  --radius:14px; --radius-sm:10px;
  --nav-h:64px; --top-h:56px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --font-head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Rajdhani',system-ui,-apple-system,'Segoe UI',sans-serif;
  --card-opacity:1;
}
:root,[data-theme="dark"]{
  --bg:#0b1720; --bg2:#12232f; --bg3:#1a3040; --bg4:#21394a; --border:#24404f;
  --text:#e8eff3; --muted:#8fa4b1; --faint:#5d7584;
  --card:rgba(18,35,47,var(--card-opacity));
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --chip-bg:#1a3040; --overlay:rgba(3,10,15,.66);
  color-scheme:dark;
}
[data-theme="light"]{
  --gold:#b3770c; --gold2:#e3a62a; --red:#cf3636;
  --bg:#fbf7ee; --bg2:#ffffff; --bg3:#f2ecdf; --bg4:#e9e1d0; --border:#e4dac6;
  --text:#18242c; --muted:#5f6f79; --faint:#93a0a8;
  --card:rgba(255,255,255,var(--card-opacity));
  --shadow:0 10px 30px rgba(60,45,20,.14);
  --chip-bg:#f2ecdf; --overlay:rgba(20,25,30,.45);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-body);font-size:16px;font-weight:500;line-height:1.4;background:#05090d;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
svg{display:block}
a{color:var(--gold);text-decoration:none}

/* ---------- app shell ---------- */
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){
  body{background:radial-gradient(circle at 30% 20%,#1f3d4a,#05090d 70%)}
  #app{height:min(920px,100vh - 32px);margin-top:16px;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid #24404f}
}
#view{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:screenIn .22s ease}
@keyframes screenIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.screen.no-anim{animation:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0}
.pad{padding:14px 16px}
.pb-nav{padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 24px)}

/* ---------- top bar ---------- */
.topbar{flex-shrink:0;height:calc(var(--top-h) + var(--safe-top));padding:var(--safe-top) 8px 0;display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--border);position:relative;z-index:5}
.topbar .title{flex:1;min-width:0;font-family:var(--font-head);font-weight:800;font-size:21px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.brand{display:flex;align-items:center;gap:9px;flex:1;padding-left:8px}
.brand img{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 12px rgba(245,185,66,.35)}
.brand span{font-family:var(--font-head);font-weight:900;font-size:25px;letter-spacing:.1em;color:var(--gold);text-shadow:0 0 14px rgba(245,185,66,.3)}
[data-theme="light"] .brand span{color:#1f3d4a;text-shadow:none}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--text);flex-shrink:0;transition:background .15s}
.icon-btn:active{background:var(--bg3)}
.icon-btn svg{width:23px;height:23px}
.badge{position:absolute;top:5px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);line-height:1}

/* ---------- bottom nav ---------- */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:flex;align-items:center;justify-content:space-around;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);z-index:20}
.nav-item{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:color .15s}
.nav-item svg{width:24px;height:24px}
.nav-item.on{color:var(--gold)}
.nav-item .avatar{width:26px;height:26px;border:2px solid transparent}
.nav-item.on .avatar{border-color:var(--gold)}
.nav-plus{flex:0 0 64px;display:grid;place-items:center}
.nav-plus span{width:54px;height:54px;border-radius:18px;margin-top:-22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),var(--gold));color:#1a1206;box-shadow:0 8px 22px rgba(224,72,72,.4);transform:rotate(45deg);transition:transform .2s}
.nav-plus span svg{transform:rotate(-45deg);width:28px;height:28px;stroke-width:2.6}
.nav-plus:active span{transform:rotate(45deg) scale(.92)}

/* ---------- typography ---------- */
.h1{font-family:var(--font-head);font-weight:900;font-size:30px;letter-spacing:.03em;line-height:1.05;text-transform:uppercase}
.h2{font-family:var(--font-head);font-weight:800;font-size:22px;letter-spacing:.03em;line-height:1.1}
.h3{font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:.02em;line-height:1.15}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.gold{color:var(--gold)}
.center{text-align:center}
.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-head);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.section-label:first-child{margin-top:4px}
.section-label>span{display:flex;align-items:center;gap:8px}
.section-label>span::before{content:'';width:4px;height:14px;border-radius:2px;background:var(--gold)}
.section-label button{color:var(--gold);font-size:12px;letter-spacing:.1em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hr{height:1px;background:var(--border);margin:14px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;font-family:var(--font-head);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;transition:transform .1s,filter .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn-primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1405;box-shadow:0 6px 18px rgba(245,185,66,.25)}
.btn-red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-outline{border:1.5px solid var(--gold);color:var(--gold)}
.btn-block{width:100%}
.btn-sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--gold);font-weight:700}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--chip-bg);border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:14px;transition:all .15s}
.chip.on{background:rgba(245,185,66,.14);border-color:var(--gold);color:var(--gold)}
.chip svg{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-family:var(--font-head);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(245,185,66,.12);color:var(--gold);border:1px solid rgba(245,185,66,.25)}
.tag.red{background:rgba(224,72,72,.12);color:#ff7a7a;border-color:rgba(224,72,72,.3)}
.tag.blue{background:rgba(90,184,232,.12);color:var(--blue);border-color:rgba(90,184,232,.3)}
.tag.green{background:rgba(63,179,127,.12);color:var(--green);border-color:rgba(63,179,127,.3)}
.tag.purple{background:rgba(155,124,240,.12);color:var(--purple);border-color:rgba(155,124,240,.3)}
.tag.gray{background:var(--bg3);color:var(--muted);border-color:var(--border)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 10px;flex-shrink:0;background:var(--bg);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;padding:12px 10px 10px;font-family:var(--font-head);font-weight:800;font-size:14.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab.on{color:var(--gold);border-color:var(--gold)}

/* ---------- avatar ---------- */
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg3);overflow:hidden;display:grid;place-items:center}
.avatar svg{width:100%;height:100%}
.av-sm{width:30px;height:30px}
.av-xs{width:22px;height:22px}
.av-lg{width:64px;height:64px}
.av-xl{width:96px;height:96px;border:3px solid var(--gold);box-shadow:0 0 0 4px rgba(245,185,66,.18),0 0 24px rgba(245,185,66,.3)}
.av-stack{display:flex}
.av-stack .avatar{border:2px solid var(--bg2);margin-left:-8px}
.av-stack .avatar:first-child{margin-left:0}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative}
.post{margin-bottom:14px}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.post-head .who{flex:1;min-width:0;line-height:1.2}
.post-head .who b{font-weight:700;font-size:15px}
.post-head .who div{font-size:12.5px;color:var(--muted)}
.post-cover{position:relative;display:flex;gap:12px;padding:4px 14px 10px}
.post-cover .cover{width:96px;flex-shrink:0}
.post-body{flex:1;min-width:0}
.post-body .h3{margin:4px 0 4px}
.post-body p{font-size:14.5px;color:var(--muted)}
.post-wide{padding:2px 14px 8px}
.post-wide .art{border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--bg3)}
.post-wide .art img,.post-wide .art svg{width:100%;height:100%;object-fit:cover}
.post-actions{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;border-top:1px solid var(--border);margin-top:4px}
.pa{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;color:var(--muted);font-weight:700;font-size:14px}
.pa svg{width:20px;height:20px}
.pa:active{background:var(--bg3)}
.pa.on{color:var(--gold)}
.pa.on-red{color:var(--red)}
.vote{display:inline-flex;align-items:center;background:var(--bg3);border-radius:10px;height:36px;border:1px solid var(--border)}
.vote button{width:34px;height:100%;display:grid;place-items:center;color:var(--muted)}
.vote button svg{width:19px;height:19px}
.vote b{min-width:28px;text-align:center;font-family:var(--font-head);font-weight:800;font-size:16px}
.vote.up{border-color:rgba(245,185,66,.5)} .vote.up b,.vote.up .v-up{color:var(--gold)}
.vote.down{border-color:rgba(224,72,72,.5)} .vote.down b,.vote.down .v-down{color:var(--red)}
.spacer{flex:1}
.hidden-post{padding:16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}

/* cover */
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--bg3);position:relative;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.cover>svg,.cover>img{width:100%;height:100%;object-fit:cover}
.cover .fmt{position:absolute;left:6px;top:6px}

/* horizontal shelves */
.shelf{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.shelf::-webkit-scrollbar{display:none}
.shelf-item{width:112px;flex-shrink:0;scroll-snap-align:start}
.shelf-item .t{font-weight:700;font-size:14px;margin-top:7px;line-height:1.15}
.progress{height:4px;border-radius:2px;background:var(--bg4);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px}

/* list rows */
.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li:active{background:var(--bg3)}
.li .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg3);color:var(--gold);flex-shrink:0}
.li .ic svg{width:20px;height:20px}
.li .chev{color:var(--faint);width:20px;height:20px}
.li .txt{flex:1;min-width:0}
.li .txt b{display:block;font-weight:700}
.li .txt span{display:block;font-size:13px;color:var(--muted)}

/* community */
.comm-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.comm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comm-tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.comm-tile b{font-family:var(--font-head);font-weight:800;font-size:17px;letter-spacing:.02em}
.comm-hero{position:relative;padding:22px 16px 16px;overflow:hidden}
.comm-hero::before{content:'';position:absolute;inset:0;background:var(--hero,linear-gradient(135deg,#1f3d4a,#0b1720));opacity:.9}
.comm-hero>*{position:relative}

/* trending */
.rank{font-family:var(--font-head);font-weight:900;font-size:30px;color:var(--gold);width:38px;text-align:center;flex-shrink:0;line-height:1}
.rank.r1{color:var(--gold2);text-shadow:0 0 14px rgba(255,204,51,.4)}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-family:var(--font-head);font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.input,.textarea,.select{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,185,66,.15)}
.textarea{min-height:110px;resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input-wrap{position:relative}
.input-wrap .input{padding-left:44px}
.input-wrap>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--faint)}
.input-wrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.hint{font-size:12.5px;color:var(--faint);margin-top:5px}
.err{font-size:13px;color:#ff7a7a;margin-top:5px;font-weight:600}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1.5px solid var(--border);border-radius:14px;height:46px;padding:0 12px}
.searchbar:focus-within{border-color:var(--gold)}
.searchbar svg{width:20px;height:20px;color:var(--faint);flex-shrink:0}
.searchbar input{flex:1;background:none;border:0;outline:none;font-size:16px;font-weight:600;min-width:0}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--bg4);position:relative;transition:background .2s;flex-shrink:0;border:1px solid var(--border)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.toggle.on{background:var(--gold)}
.toggle.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:4px;border:1px solid var(--border)}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:17px;height:17px}
.seg button.on{background:var(--bg2);color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.18)}
input[type=range]{width:100%;accent-color:var(--gold)}
.upload{border:2px dashed var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);text-align:center;width:100%;background:var(--bg2)}
.upload svg{width:30px;height:30px;color:var(--gold)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--bg3)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.thumb button svg{width:14px;height:14px}
.thumb i{position:absolute;left:4px;bottom:3px;font-style:normal;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:0 5px;border-radius:4px}
.fmt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fmt-btn{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.fmt-btn .e{font-size:28px;line-height:1}
.fmt-btn.on{border-color:var(--gold);background:rgba(245,185,66,.1);color:var(--gold)}

/* ---------- splash / onboarding / auth ---------- */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--cream);z-index:100;transition:opacity .4s}
.splash img{width:180px;height:180px;border-radius:50%;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.splash b{font-family:var(--font-head);font-weight:900;font-size:40px;letter-spacing:.16em;color:#1f3d4a;animation:fadeUp .6s .25s both}
.splash small{font-weight:700;color:#7c6a4c;letter-spacing:.06em;animation:fadeUp .6s .4s both}
.splash .loader{width:46px;height:4px;border-radius:2px;background:#eadfc8;overflow:hidden;margin-top:10px}
.splash .loader i{display:block;height:100%;width:40%;background:var(--red);border-radius:2px;animation:load 1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.onb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 28px;gap:16px}
.onb .art{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;font-size:96px;background:radial-gradient(circle,rgba(245,185,66,.22),transparent 70%)}
.onb .art img{width:190px;height:190px;border-radius:50%;border:4px solid var(--gold)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--bg4);transition:all .25s}
.dots i.on{width:26px;background:var(--gold)}
.auth-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 20px 16px;background:radial-gradient(ellipse at top,rgba(245,185,66,.16),transparent 70%)}
.auth-hero img{width:104px;height:104px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 30px rgba(245,185,66,.35)}
.divider{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:16px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ---------- work detail ---------- */
.work-hero{position:relative;padding:18px 16px 16px;display:flex;gap:16px;overflow:hidden}
.work-hero .bgblur{position:absolute;inset:-40px;filter:blur(40px) saturate(1.3);opacity:.45;z-index:0}
.work-hero .bgblur svg,.work-hero .bgblur img{width:100%;height:100%;object-fit:cover}
.work-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,var(--bg));z-index:0}
.work-hero>*:not(.bgblur){position:relative;z-index:1}
.work-hero .cover{width:124px;flex-shrink:0}
.stats{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.stat{flex:1;text-align:center;padding:10px 4px;border-right:1px solid var(--border)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--font-head);font-weight:800;font-size:21px;color:var(--gold);line-height:1.1}
.stat span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.credit{display:flex;align-items:center;gap:10px;padding:8px 0}
.chapter{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.chapter:last-child{border-bottom:0}
.chapter .n{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;color:var(--gold);flex-shrink:0}
.chapter.read .n{background:rgba(63,179,127,.15);color:var(--green)}
.sticky-cta{flex-shrink:0;padding:10px 16px calc(10px + var(--safe-bottom));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:10px}

/* comments */
.comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.comment:last-child{border-bottom:0}
.comment .body{flex:1;min-width:0}
.comment .meta{font-size:13px;color:var(--muted)}
.comment .meta b{color:var(--text);font-weight:700;margin-right:4px}
.comment p{font-size:15px;margin:3px 0 4px;word-wrap:break-word;white-space:pre-wrap}
.comment .acts{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--faint)}
.comment .acts button{display:inline-flex;align-items:center;gap:4px}
.comment .acts svg{width:15px;height:15px}
.comment .acts .on{color:var(--red)}
.replies{margin-top:6px;padding-left:10px;border-left:2px solid var(--border)}
.replies .comment{padding:8px 0;border:0}
.composer{flex-shrink:0;display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + var(--safe-bottom));background:var(--bg2);border-top:1px solid var(--border)}
.composer textarea{flex:1;background:var(--bg3);border:1.5px solid var(--border);border-radius:20px;padding:10px 14px;font-size:15.5px;font-weight:600;outline:none;resize:none;max-height:110px;min-height:42px;line-height:1.35}
.composer textarea:focus{border-color:var(--gold)}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#1d1405;display:grid;place-items:center;flex-shrink:0}
.send-btn svg{width:20px;height:20px}
.reply-to{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--bg3);font-size:13px;color:var(--muted);border-top:1px solid var(--border)}

/* ---------- reader ---------- */
.reader{--rbg:#f6efe1;--rtext:#2b2217}
.reader.r-dark{--rbg:#0e161c;--rtext:#d9e2e7}
.reader.r-light{--rbg:#ffffff;--rtext:#1b1b1b}
.reader.r-sepia{--rbg:#f6efe1;--rtext:#2b2217}
.reader .scroll{background:var(--rbg);color:var(--rtext)}
.reader .topbar{background:var(--rbg);color:var(--rtext);border-color:rgba(127,127,127,.2)}
.reader .topbar .icon-btn{color:var(--rtext)}
.reader-text{max-width:640px;margin:0 auto;padding:26px 22px 60px;font-family:Georgia,'Times New Roman',serif;font-size:var(--rsize,18px);line-height:1.75;font-weight:400}
.reader-text h2{font-family:var(--font-head);font-weight:800;font-size:1.5em;letter-spacing:.02em;margin-bottom:4px;line-height:1.15}
.reader-text .by{font-family:var(--font-body);font-size:14px;opacity:.65;margin-bottom:26px}
.reader-text p{margin-bottom:1.05em;text-indent:1.4em}
.reader-text p:first-of-type{text-indent:0}
.reader-text p:first-of-type::first-letter{font-size:3.1em;float:left;line-height:.9;padding:4px 8px 0 0;font-family:var(--font-head);font-weight:900;color:var(--red)}
.reader-pages{background:#111;padding-bottom:40px}
.reader-pages .page{width:100%;max-width:640px;margin:0 auto 6px}
.reader-pages .page img,.reader-pages .page svg{width:100%;height:auto;display:block}
.reader-progress{position:absolute;left:0;right:0;top:calc(var(--top-h) + var(--safe-top));height:3px;z-index:6}
.reader-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .1s}
.reader-end{text-align:center;padding:30px 20px 50px;font-family:var(--font-body)}
.reader-panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--border);padding:16px 16px calc(16px + var(--safe-bottom));z-index:30;border-radius:20px 20px 0 0;box-shadow:var(--shadow);animation:sheetUp .25s ease}

/* ---------- match ---------- */
.match-wrap{flex:1;position:relative;padding:10px 16px 0;display:flex;flex-direction:column}
.deck{position:relative;flex:1;min-height:380px}
.mcard{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;will-change:transform}
.mcard.back{transform:scale(.95) translateY(14px);opacity:.7;pointer-events:none}
.mcard .mtop{position:relative;height:52%;min-height:180px;display:grid;place-items:center;overflow:hidden}
.mcard .mtop .bgart{position:absolute;inset:0}
.mcard .mtop .bgart svg{width:100%;height:100%}
.mcard .mtop .avatar{width:132px;height:132px;border:4px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative}
.mcard .compat{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;border-radius:20px;padding:5px 11px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px}
.mcard .compat svg{width:15px;height:15px;color:var(--gold)}
.mcard .minfo{padding:14px 16px;flex:1;overflow-y:auto}
.mcard .stamp{position:absolute;top:30px;padding:6px 14px;border:4px solid;border-radius:10px;font-family:var(--font-head);font-weight:900;font-size:32px;letter-spacing:.1em;opacity:0;z-index:3}
.mcard .stamp.like{left:22px;color:var(--green);border-color:var(--green);transform:rotate(-14deg)}
.mcard .stamp.nope{right:22px;color:var(--red);border-color:var(--red);transform:rotate(14deg)}
.match-actions{display:flex;justify-content:center;align-items:center;gap:22px;padding:16px 0 calc(var(--nav-h) + var(--safe-bottom) + 14px)}
.round{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .12s}
.round:active{transform:scale(.9)}
.round svg{width:28px;height:28px}
.round.sm{width:48px;height:48px}
.round.sm svg{width:21px;height:21px}
.round.nope{color:var(--red)}
.round.like{color:var(--green)}
.round.info{color:var(--blue)}
.its-match{position:absolute;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,rgba(245,185,66,.32),transparent 62%),rgba(5,10,14,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center;animation:fade .3s}
.its-match .h1{font-size:46px;color:var(--gold);text-shadow:0 0 30px rgba(245,185,66,.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.its-match .pair{display:flex;align-items:center}
.its-match .pair .avatar{width:110px;height:110px;border:4px solid var(--gold)}
.its-match .pair .avatar:last-child{margin-left:-20px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px 24px;color:var(--muted)}
.empty .e{font-size:54px;line-height:1}
.empty img{width:96px;height:96px;border-radius:50%;opacity:.9}

/* ---------- chat ---------- */
.msgs{padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;font-size:15.5px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap;position:relative}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1405;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--bg3);border-bottom-left-radius:5px}
.msg time{display:block;font-size:10.5px;opacity:.6;margin-top:2px;text-align:right}
.msg img{border-radius:12px;margin:-3px -6px 4px;max-width:calc(100% + 12px);width:220px}
.day-sep{align-self:center;font-size:11.5px;font-weight:700;color:var(--faint);background:var(--bg2);padding:3px 10px;border-radius:10px;margin:8px 0;text-transform:uppercase;letter-spacing:.08em}
.typing{align-self:flex-start;background:var(--bg3);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.conv .txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0}
.online{position:relative}
.online::after{content:'';position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg2)}

/* ---------- profile ---------- */
.banner{height:120px;position:relative;overflow:hidden}
.banner svg,.banner img{width:100%;height:100%;object-fit:cover}
.profile-head{padding:0 16px;margin-top:-48px;position:relative}
.profile-head .row.top{align-items:flex-end;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.av-pick{display:flex;gap:12px;flex-wrap:wrap}
.av-pick button{width:62px;height:62px;border-radius:50%;border:3px solid transparent;overflow:hidden;padding:0;background:var(--bg3);display:grid;place-items:center}
.av-pick button.on{border-color:var(--gold);box-shadow:0 0 12px rgba(245,185,66,.4)}
.av-pick button img,.av-pick button svg{width:100%;height:100%;object-fit:cover}
.av-pick button.up svg{width:24px;height:24px;color:var(--gold)}

/* ---------- notifs ---------- */
.notif{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left;align-items:flex-start}
.notif.unread{background:rgba(245,185,66,.06)}
.notif .ni{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative}
.notif .ni svg{width:20px;height:20px}
.notif p{font-size:14.5px;line-height:1.35}
.notif p b{font-weight:700}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;background:var(--overlay);z-index:60;animation:fade .2s;display:flex;align-items:flex-end}
.overlay.center{align-items:center;justify-content:center;padding:24px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--bg2);border-radius:22px 22px 0 0;padding:8px 0 calc(12px + var(--safe-bottom));max-height:88%;overflow-y:auto;animation:sheetUp .26s cubic-bezier(.2,.9,.3,1);border-top:1px solid var(--border)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--bg4);margin:4px auto 10px}
.sheet .sheet-title{font-family:var(--font-head);font-weight:800;font-size:19px;letter-spacing:.05em;text-transform:uppercase;padding:4px 18px 10px}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;font-weight:700;font-size:16px;text-align:left}
.sheet .opt:active{background:var(--bg3)}
.sheet .opt svg{width:22px;height:22px;color:var(--muted)}
.sheet .opt.danger,.sheet .opt.danger svg{color:var(--red)}
.dialog{width:100%;max-width:360px;background:var(--bg2);border-radius:20px;padding:22px 20px 18px;border:1px solid var(--border);box-shadow:var(--shadow);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.dialog .h2{margin-bottom:6px}
.dialog p{color:var(--muted);font-size:15px}
.dialog .row{margin-top:18px;justify-content:flex-end}
.radio-row{display:flex;align-items:center;gap:12px;padding:12px 18px;width:100%;text-align:left;font-weight:600}
.radio-row i{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;display:grid;place-items:center}
.radio-row.on i{border-color:var(--gold)}
.radio-row.on i::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--gold)}

/* toast */
.toast{position:absolute;left:50%;top:calc(var(--top-h) + var(--safe-top) + 10px);transform:translateX(-50%) translateY(-20px);background:var(--bg4);color:var(--text);border:1px solid var(--gold);padding:11px 18px;border-radius:14px;font-weight:700;font-size:15px;z-index:90;opacity:0;transition:all .28s;pointer-events:none;box-shadow:var(--shadow);max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* pull hint & misc */
.banner-tip{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(224,72,72,.16),rgba(245,185,66,.16));border:1px solid rgba(245,185,66,.3)}
.banner-tip img{width:52px;height:52px;border-radius:50%;flex-shrink:0}
.kbd{font-family:monospace;background:var(--bg3);padding:1px 6px;border-radius:5px;border:1px solid var(--border);font-size:13px}
.fab{position:absolute;right:16px;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1405;display:grid;place-items:center;box-shadow:0 8px 22px rgba(245,185,66,.35);z-index:15}
.fab svg{width:26px;height:26px}
.skeleton{background:linear-gradient(90deg,var(--bg3),var(--bg4),var(--bg3));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.mod-flag{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(224,72,72,.1);border:1px solid rgba(224,72,72,.3);color:#ff8a8a;font-size:13.5px;font-weight:600}
.mod-flag svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}

</style>
</head>

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function escXml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wrapWords(text,maxChars,maxLines){
  const words=String(text).split(/\s+/);const lines=[];let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>maxChars && cur){lines.push(cur);cur=w}else cur=(cur+' '+w).trim() }
  if(cur)lines.push(cur);
  if(lines.length>maxLines){const l=lines.slice(0,maxLines);l[maxLines-1]=l[maxLines-1].replace(/.{0,2}$/,'…');return l}
  return lines;
}

  }else if(motif==='city'){

    for(let i=0;i<12;i++){const w=14+r()*20,x=i*17-6,h=60+r()*120;art+=`<rect x="${x}" y="${260-h}" width="${w}" height="${h}" fill="${p[1]}" opacity="${.7+r()*.3}"/>`;

{title:'Capítulo 1 · El farolero',text:`Nadie en Ciudad Ceniza recordaba quién había encendido el primer farol, pero todos sabían quién apagaba el último. Se llamaba Elías Vargas, tenía diecisiete años y un abrigo dos tallas más grande que había heredado de su abuelo, junto con el oficio.

Cada noche recorría las calles empedradas con una pértiga de bronce y una lámpara de aceite. Los faroles de la ciudad no eran comunes: guardaban, en lugar de fuego, pequeños recuerdos que la gente olvidaba. Un cumpleaños, una canción, el olor del pan de la abuela. Mientras ardían, nadie podía perderlos del todo.

Aquella noche, al llegar a la plaza del reloj, Elías encontró el farol número cuarenta y dos roto. El vidrio estaba en el suelo, esparcido como escarcha, y la llama había desaparecido. No se había apagado: se la habían llevado.

—Eso no es posible —murmuró, agachándose. Entre los cristales había una pluma negra, larga como un antebrazo, que todavía estaba tibia.

Desde la torre del reloj, algo lo observaba. Elías no lo vio, pero lo sintió: ese frío particular que se te mete por la nuca cuando alguien pronuncia tu nombre en una habitación vacía.

{title:'Capítulo 2 · La biblioteca de las cosas olvidadas',text:`La biblioteca municipal abría a las ocho, pero Inés Montoya llegaba a las seis. Le gustaba el silencio de los pasillos antes de que el mundo despertara, y sobre todo le gustaba el sótano, donde guardaban los registros de los faroles.

Cuando Elías golpeó la puerta trasera con la pluma negra envuelta en un pañuelo, Inés supo de inmediato que su mañana tranquila había terminado.

—¿De dónde sacaste eso? —preguntó, sin saludar.

—Del farol cuarenta y dos. Alguien se llevó la llama.

—Aquí dice que el farol guardaba un recuerdo de toda la ciudad —leyó en voz baja—. El nombre del río.

const APP_VERSION = '1.0.0';
const KEY = 'choggun_app_v1';
let S = null;

/* ---------- utilidades ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ n=Number(n)||0; if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1).replace('.0','')+' M'; if(Math.abs(n)>=1e3) return (n/1e3).toFixed(1).replace('.0','')+' k'; return String(n); }
function timeAgo(t){
  const s=Math.max(1,Math.floor((Date.now()-t)/1000));
  if(s<60) return 'ahora'; const m=Math.floor(s/60); if(m<60) return `hace ${m} min`;
  const h=Math.floor(m/60); if(h<24) return `hace ${h} h`; const d=Math.floor(h/24); if(d<7) return `hace ${d} d`;
  return new Date(t).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
}
function clock(t){ return new Date(t).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}); }
function dayLabel(t){ const d=new Date(t), n=new Date(); const y=new Date(); y.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString()) return 'Hoy'; if(d.toDateString()===y.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'short'}); }
function pwHash(p){ return 'h'+hashStr('choggun::'+p).toString(36)+hashStr(p+'::salt').toString(36); }
function newId(p){ return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function wordCount(t){ return (String(t||'').trim().match(/\S+/g)||[]).length; }
function normalize(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function isToxic(text){ const t=' '+normalize(text)+' '; return BAD_WORDS.some(w=>t.includes(normalize(w))); }

/* ---------- estado / persistencia ---------- */
function defaultState(){
  const users={};
  USERS_SEED.forEach((u,i)=>{ users[u.username]=Object.assign({email:u.username+'@choggun.app',passHash:null,followers:[],following:[],joined:NOW0-(200+i*13)*24*H,banner:u.username,karma:300+i*137,followersBase:120+((i*389)%1900)},u); });
  return { v:1, session:null, users, works:seedWorks(), communities:COMMUNITIES_SEED.map(c=>({...c})),
    joined:{}, saved:{}, history:{}, matches:{}, chats:{}, notifs:{}, reports:[], hidden:{}, drafts:{},
    settings:{theme:'dark',cardOpacity:1,readerSize:18,readerTheme:'sepia',notifications:true,mature:false,onboarded:false} };
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw); }catch(e){ S=null; }
  if(!S||S.v!==1) S=defaultState();
}
let saveTimer=null;
function save(now){
  clearTimeout(saveTimer);
  const doSave=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('⚠️ Almacenamiento lleno: elimina borradores o imágenes'); } };

}

const community = id => S.communities.find(c=>c.id===id) || {id,name:id,icon:'🌐',desc:'',members:0,color:'#f5b942',cat:'Otros'};
function score(w){ return (w.baseVotes||0)+Object.values(w.votes||{}).reduce((a,b)=>a+b,0); }
function myVote(w){ return S.session ? (w.votes||{})[S.session]||0 : 0; }
function commentCount(w){ return (w.comments||[]).reduce((a,c)=>a+1+(c.replies||[]).length,0); }
function isSaved(id){ return S.session && (S.saved[S.session]||[]).includes(id); }
function isJoined(cid){ return S.session && (S.joined[S.session]||[]).includes(cid); }
function isFollowing(u){ const m=me(); return m && (m.following||[]).includes(u); }
function followersCount(u){ const x=user(u); return (x.followersBase||0)+(x.followers||[]).length; }
function isHiddenForMe(w){ return w.removed || (S.session && (S.hidden[S.session]||[]).includes(w.id)); }
function visibleWorks(){ return S.works.filter(w=>w.status==='publicado' && !w.removed && (S.settings.mature || !w.mature || w.author===S.session)); }

/* ---------- navegación ---------- */
let stack=[{name:'home',params:{}}];
let navAnim=true;
const SCREENS={};
const TAB_SCREENS=['home','explore','match','profile'];
function current(){ return stack[stack.length-1]; }
function saveScroll(){ const sc=$('#view .scroll'); if(sc) current().scroll=sc.scrollTop; }
function go(name,params={}){ closeOverlay(true); saveScroll(); stack.push({name,params}); navAnim=true; render(); }
function replace(name,params={}){ closeOverlay(true); stack[stack.length-1]={name,params}; navAnim=true; render(); }
function setTab(name){ closeOverlay(true); if(current().name===name && stack.length===1){ const sc=$('#view .scroll'); if(sc) sc.scrollTo({top:0,behavior:'smooth'}); return; } stack=[{name,params:{}}]; navAnim=false; render(); }
function back(){
  if(overlayOpen()){ closeOverlay(); return true; }
  if(stack.length>1){ stack.pop(); navAnim=false; render(); return true; }
  if(current().name!=='home' && S.session!==undefined && TAB_SCREENS.includes(current().name)){ setTab('home'); return true; }
  return false;
}
function refresh(){ saveScroll(); navAnim=false; render(); }

function render(){
  const cur=current(); const scr=SCREENS[cur.name]; if(!scr){ stack=[{name:'home',params:{}}]; return render(); }
  applyTheme();
  const view=$('#view');
  let html=scr.render(cur.params||{});
  const isTab=TAB_SCREENS.includes(cur.name) && !scr.noNav;
  view.innerHTML=`<section class="screen ${navAnim?'':'no-anim'} ${scr.cls||''}">${html}</section>${isTab?bottomNav(cur.name):''}`;
  const sc=$('#view .scroll'); if(sc && cur.scroll) sc.scrollTop=cur.scroll;
  if(scr.after) scr.after(cur.params||{}, view);
}
function bottomNav(active){
  const m=me();
  const item=(n,ic,label)=>`<button class="nav-item ${active===n?'on':''}" data-a="tab" data-t="${n}">${ic}<span>${label}</span></button>`;
  return `<nav class="bottom-nav">${item('home',icon('home'),'Inicio')}${item('explore',icon('compass'),'Explorar')}<button class="nav-plus" data-a="create" aria-label="Publicar"><span>${icon('plus')}</span></button>${item('match',icon('zap'),'Match')}${item('profile',m?avatarHTML(m):icon('user'),'Perfil')}</nav>`;
}
function applyTheme(){
  let t=S.settings.theme; if(t==='system') t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  document.documentElement.style.setProperty('--card-opacity',S.settings.cardOpacity);
  const mc=$('meta[name=theme-color]'); if(mc) mc.content=t==='light'?'#fbf7ee':'#0b1720';
  try{ const SB=window.Capacitor?.Plugins?.StatusBar; if(SB){ SB.setStyle({style:t==='light'?'LIGHT':'DARK'}); SB.setBackgroundColor?.({color:t==='light'?'#fbf7ee':'#0b1720'}); } }catch(e){}
}

/* ---------- imágenes ---------- */
function pickImages({multiple=false,max=1000,quality=.82}={}){
  return new Promise(resolve=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; if(multiple) inp.multiple=true;
    inp.onchange=async()=>{ const files=[...inp.files]; const out=[]; for(const f of files){ try{ out.push(await resizeImage(f,max,quality)); }catch(e){ toast('No se pudo leer una imagen'); } } resolve(out); };
    inp.click();
  });
}
function resizeImage(file,max,quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',quality)); }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

async function shareText(title,text){

  try{ if(navigator.share){ await navigator.share({title,text:full}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(full); toast('📋 Copiado al portapapeles'); }catch(e){ toast('No se pudo compartir'); }
}

  if(d.pass.length<6||!/[a-z]/.test(d.pass)||!/\d/.test(d.pass)){ err.textContent='La contraseña debe tener 6+ caracteres, un número y una minúscula'; return; }
  if(d.pass!==d.pass2){ err.textContent='Las contraseñas no coinciden'; return; }
  if(!d.terms){ err.textContent='Debes aceptar las normas de la comunidad'; return; }
  if(Object.keys(S.users).some(k=>k.toLowerCase()===un.toLowerCase())){ err.textContent='Ese nombre de usuario ya existe'; return; }
  if(Object.values(S.users).some(x=>String(x.email).toLowerCase()===d.email.trim().toLowerCase())){ err.textContent='Ya existe una cuenta con ese correo'; return; }
  S.users[un]={username:un,name:`${d.name.trim()} ${d.last.trim()}`,email:d.email.trim(),passHash:pwHash(d.pass),role:d.role||ROLES[0],avatar:null,bio:'',genres:[],collab:[],followers:[],following:[],joined:Date.now(),banner:un+Date.now(),karma:0,followersBase:0};
  save(true); loginAs(un,true);
};

function feedList(){
  let list=visibleWorks(); const m=me();
  if(UI.feedFmt!=='all') list=list.filter(w=>w.type===UI.feedFmt);
  if(UI.feedTab==='siguiendo'){
    if(!m) return null;
    const j=S.joined[m.username]||[];
    list=list.filter(w=>(m.following||[]).includes(w.author)||j.includes(w.community)||w.author===m.username);
    list.sort((a,b)=>b.created-a.created);
  }else if(UI.feedTab==='nuevo') list.sort((a,b)=>b.created-a.created);
  else list.sort((a,b)=>(b.pinned?1e9:0)+hot(b)-((a.pinned?1e9:0)+hot(a)));
  return list;
}

F.comment=form=>{
  if(!requireAuth('comentar')) return; const ta=$('textarea',form); const text=ta.value.trim(); if(!text) return;
  const w=work(form.dataset.id);
  const post=(flagged)=>{
    const c={id:newId('c'),user:S.session,text,time:Date.now(),likes:[],flagged:!!flagged};
    if(UI.replyTo){ const p=w.comments.find(x=>x.id===UI.replyTo.c); (p.replies=p.replies||[]).push(c); if(p.user!==S.session) notify(p.user,{type:'comment',text:`<b>${esc(me().name)}</b> respondió tu comentario: “${esc(text.slice(0,60))}”`,link:{s:'work',id:w.id,focus:'comments'}}); }
    else { w.comments.push(c); if(w.author!==S.session) notify(w.author,{type:'comment',text:`<b>${esc(me().name)}</b> comentó “${esc(w.title)}”: “${esc(text.slice(0,60))}”`,link:{s:'work',id:w.id,focus:'comments'}}); }
    if(flagged) S.reports.unshift({rid:newId('r'),kind:'comment',id:c.id,parent:w.id,reason:'Posible lenguaje ofensivo (detección automática)',note:text,by:'sistema',t:Date.now(),status:'pendiente'});
    UI.replyTo=null; S.users[S.session].karma=(S.users[S.session].karma||0)+2; save();
    ta.value=''; $('#comments').innerHTML=commentsHTML(w); $('#composerWrap').outerHTML=composerHTML(w,true); toast('💬 Comentario publicado');
    if(!flagged && w.author!==S.session && Math.random()<.7 && !user(w.author).passHash) later(3500,()=>{ const r={id:newId('c'),user:w.author,text:['¡Gracias por leer y comentar! 🙌','Me alegra mucho que te guste 💛','¡Tomo nota del feedback!','Gracias, el próximo capítulo viene con sorpresas 👀'][Math.floor(Math.random()*4)],time:Date.now(),likes:[S.session]}; (c.replies=c.replies||[]).push(r); notify(S.session,{type:'comment',text:`<b>${esc(user(w.author).name)}</b> respondió tu comentario en “${esc(w.title)}”`,link:{s:'work',id:w.id,focus:'comments'}}); save(); if(current().name==='work'&&current().params.id===w.id) $('#comments').innerHTML=commentsHTML(w); });
  };
  if(isToxic(text)) showDialog({title:'⚠️ Revisión automática',html:`<div class="mod-flag" style="margin-top:8px">${icon('shield')}<span>Nuestro sistema detectó lenguaje que podría ser ofensivo. CHOGGUN es un espacio de feedback respetuoso.</span></div><p style="margin-top:10px">Si lo publicas, será enviado a revisión humana.</p>`,ok:'Publicar igual',cancel:'Editar',onOk:()=>post(true)});
  else post(false);
};

   <div class="row" style="justify-content:center;gap:10px;margin-bottom:16px"><button class="btn btn-sm ${v>0?'btn-primary':'btn-ghost'}" data-a="readerVote" data-id="${w.id}">${icon('up')} ${v>0?'¡Votado!':'Votar'}</button><button class="btn btn-sm btn-ghost" data-a="readerComment" data-id="${w.id}">${icon('comment')} Comentar</button><button class="btn btn-sm btn-ghost" data-a="share" data-id="${w.id}">${icon('share')}</button></div>
   <div class="row" style="justify-content:center;gap:10px">${prev?`<button class="btn btn-ghost" data-a="read" data-id="${w.id}" data-ch="${ch-1}" data-replace="1">${icon('back')} Anterior</button>`:''}${next?`<button class="btn btn-primary" data-a="read" data-id="${w.id}" data-ch="${ch+1}" data-replace="1">Siguiente ${icon('chevR')}</button>`:`<div class="small" style="opacity:.7">Estás al día ✨ Sigue al autor para enterarte del próximo capítulo.</div>`}</div></div></div>`;
}, after(p){
  const scr=$('#view .screen'); scr.classList.add('r-'+S.settings.readerTheme);

  const hist=S.session?(S.history[S.session]=S.history[S.session]||{}):null;
  if(hist){ const h=hist[w.id]=hist[w.id]||{ch:0,pct:0,read:[]}; h.ch=ch; h.t=Date.now(); if(h.pctCh!==ch) h.pct=0; h.pctCh=ch; save(); }
  let ticking=false;
  sc.addEventListener('scroll',()=>{ if(ticking) return; ticking=true; requestAnimationFrame(()=>{ ticking=false; const max=sc.scrollHeight-sc.clientHeight; const pct=max>0?sc.scrollTop/max:1; bar.style.width=(pct*100)+'%';
    if(hist){ const h=hist[w.id]; h.pct=pct; if(pct>.9 && !h.read.includes(ch)){ h.read.push(ch); } save(); } }); },{passive:true});
} };

function exploreBody(){
  const q=normalize(UI.exploreQ.trim());
  if(q){
    const f=UI.exploreFilter;
    const works=visibleWorks().filter(w=>normalize(w.title+' '+w.synopsis+' '+(w.genres||[]).join(' ')+' '+user(w.author).name+' '+FORMATS[w.type].label).includes(q)).sort((a,b)=>score(b)-score(a));
    const comms=S.communities.filter(c=>normalize(c.name+' '+c.id+' '+c.desc+' '+c.cat).includes(q));
    const users=Object.values(S.users).filter(u=>normalize(u.name+' '+u.username+' '+u.role+' '+(u.genres||[]).join(' ')).includes(q));
    const chips=`<div class="chips" style="margin-bottom:12px">${[['all','Todo'],['works',`Obras (${works.length})`],['comms',`Comunidades (${comms.length})`],['users',`Personas (${users.length})`]].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-a="exploreFilter" data-k="${k}">${l}</button>`).join('')}</div>`;
    let out='';
    if((f==='all'||f==='users')&&users.length) out+=`<div class="section-label"><span>Personas</span></div><div class="list" style="margin-bottom:6px">${users.slice(0,f==='all'?4:50).map(u=>`<button class="li" data-a="user" data-u="${u.username}">${avatarHTML(u)}<span class="txt"><b>${nameHTML(u.username)}</b><span>@${esc(u.username)} · ${esc(u.role)}</span></span>${icon('chevR','class="chev"')}</button>`).join('')}</div>`;
    if((f==='all'||f==='comms')&&comms.length) out+=`<div class="section-label"><span>Comunidades</span></div><div class="list" style="margin-bottom:6px">${comms.slice(0,f==='all'?4:50).map(commRow).join('')}</div>`;
    if((f==='all'||f==='works')&&works.length) out+=`<div class="section-label"><span>Obras y publicaciones</span></div>${works.slice(0,f==='all'?6:60).map(postCard).join('')}`;
    return chips+(out||emptyHTML('😕','Sin resultados',`No encontramos nada para “${esc(UI.exploreQ)}”. Prueba con otra palabra.`));
  }
  const trend=visibleWorks().sort((a,b)=>hot(b)-hot(a)).slice(0,5);
  const cats=[...new Set(S.communities.map(c=>c.cat))];
  return `<div class="section-label"><span>🔥 Tendencias</span></div><div class="list">${trend.map((w,i)=>`<button class="li" data-a="open" data-id="${w.id}"><span class="rank ${i===0?'r1':''}">#${i+1}</span><span class="txt"><b class="ellipsis">${esc(w.title)}</b><span>${FORMATS[w.type].emoji} ${FORMATS[w.type].label} · ${esc(user(w.author).name)}</span></span><span class="tag">▲ ${fmtNum(score(w))}</span></button>`).join('')}</div>
  <div class="section-label"><span>Géneros</span></div><div class="chips wrap">${GENRES.map(g=>`<button class="chip" data-a="searchFor" data-q="${esc(g)}">${esc(g)}</button>`).join('')}</div>
  ${cats.map(cat=>`<div class="section-label"><span>${esc(cat)}</span></div><div class="comm-grid">${S.communities.filter(c=>c.cat===cat).map(commTile).join('')}</div>`).join('')}
  <div class="banner-tip" style="margin-top:20px"><div class="comm-icon" style="background:rgba(245,185,66,.18)">➕</div><div class="grow"><b class="h3">Crea tu comunidad</b><div class="small muted">Comparte tus intereses y conecta con otros creadores.</div></div><button class="btn btn-primary btn-sm" data-a="go" data-s="createCommunity">Crear</button></div>`;
}

F.community=form=>{
  if(!requireAuth('crear comunidades')) return; const d=Object.fromEntries(new FormData(form)); const err=$('[data-err]',form); const id=(d.name||'').trim().toLowerCase();
  if(!/^[a-z0-9_]{3,24}$/.test(id)){ err.textContent='Nombre inválido: 3–24 letras minúsculas, números o _'; return; }

  if(!d.desc.trim()){ err.textContent='Escribe una descripción'; return; }
  if(isToxic(d.desc+' '+id)){ err.textContent='La descripción contiene lenguaje no permitido'; return; }

};

function validateDraft(d,strict){
  if((d.title||'').trim().length<3) return 'El título debe tener al menos 3 caracteres';
  if(!strict) return null;
  if(!(d.synopsis||'').trim()) return d.type==='foro'?'Escribe el contenido de tu publicación':'Escribe una sinopsis o descripción';
  if(d.type==='novela'||d.type==='relato'){ if(d.chapters.some(c=>wordCount(c.text)<20)) return 'Cada capítulo debe tener al menos 20 palabras'; }
  if(d.type==='manga'||d.type==='comic'){ if(d.chapters.some(c=>!(c.pages||[]).length)) return 'Sube al menos una página en cada capítulo'; }
  if(d.type==='ilustracion' && !d.image) return 'Sube la imagen de tu ilustración';
  return null;
}
function buildWork(d,status){
  const chapters=(d.type==='foro'||d.type==='ilustracion')?[]:d.chapters.map(c=>d.type==='manga'||d.type==='comic'?{title:c.title.trim()||'Capítulo',pages:c.pages}:{title:c.title.trim()||'Capítulo',text:c.text.trim()});
  return {type:d.type,title:d.title.trim(),synopsis:(d.synopsis||'').trim(),community:d.community,genres:d.genres,cover:d.cover||null,coverSeed:d.coverSeed||null,image:d.type==='ilustracion'?d.image:null,chapters,credits:d.type==='foro'?[]:d.credits,license:d.license,mature:d.mature,status};
}
A.saveDraft=()=>{
  const err=validateDraft(draft,false); if(err){ const e=$('#draftErr'); if(e) e.textContent=err; else toast(err); return; }
  const data=buildWork(draft, draft.editId? (work(draft.editId).status) : 'borrador');
  if(draft.editId){ Object.assign(work(draft.editId),data); }
  else S.works.push({...data,id:newId('w'),author:S.session,votes:{},comments:[],views:0,baseVotes:0,created:Date.now()});
  save(true); draft=null; closeOverlay(); stack.pop(); render(); toast('📝 Guardado en borradores (Perfil › Borradores)');
};
A.publish=()=>{
  const d=draft; const err=validateDraft(d,true); const e=$('#draftErr'); if(err){ e.textContent=err; e.scrollIntoView({block:'center'}); return; }
  const doPub=()=>{
    const data=buildWork(d,'publicado'); let w;
    if(d.editId){ w=work(d.editId); const wasDraft=w.status!=='publicado'; Object.assign(w,data); if(wasDraft) w.created=Date.now(); }
    else { w={...data,id:newId('w'),author:S.session,votes:{},comments:[],views:0,baseVotes:0,created:Date.now()}; S.works.push(w); S.users[S.session].karma=(S.users[S.session].karma||0)+10; }
    (w.credits||[]).forEach(c=>notify(c.user,{type:'system',text:`<b>${esc(me().name)}</b> te dio crédito como ${esc(c.role)} en “${esc(w.title)}”`,link:{s:'work',id:w.id}}));
    save(true); draft=null; replace('work',{id:w.id}); toast(d.editId?'✅ Cambios guardados':'🚀 ¡Publicado en c/'+w.community+'!');
    if(!d.editId){ const fan1=randomFan([S.session]); const fan2=randomFan([S.session,fan1]);
      later(5000,()=>{ if(!work(w.id)) return; w.votes[fan1]=1; save(); softRefreshWork(w.id); notify(S.session,{type:'vote',text:`<b>${esc(user(fan1).name)}</b> votó tu publicación “${esc(w.title)}”`,link:{s:'work',id:w.id}}); });
      later(11000,()=>{ if(!work(w.id)) return; const txt=w.type==='foro'?'¡Muy buen tema! Me sumo a la discusión 🙌':['¡Me encantó! Quiero leer más 😍','Gran inicio, la atmósfera está brutal.','¿Cuándo sale lo siguiente? 👀','Qué buen estilo, te sigo.'][Math.floor(Math.random()*4)]; w.comments.push({id:newId('c'),user:fan2,text:txt,time:Date.now(),likes:[]}); save(); notify(S.session,{type:'comment',text:`<b>${esc(user(fan2).name)}</b> comentó: “${esc(txt)}”`,link:{s:'work',id:w.id,focus:'comments'}}); softRefreshWork(w.id); });
    }
    return w;
  };
  if(isToxic(d.title+' '+d.synopsis)) showDialog({title:'⚠️ Revisión automática',html:`<div class="mod-flag" style="margin-top:8px">${icon('shield')}<span>El título o la descripción podrían contener lenguaje ofensivo. Puedes editarlo o publicarlo y será revisado por moderación.</span></div>`,ok:'Publicar igual',cancel:'Editar',onOk:()=>{ const nw=doPub(); S.reports.unshift({rid:newId('r'),kind:'work',id:nw.id,reason:'Posible lenguaje ofensivo (detección automática)',note:'',by:'sistema',t:Date.now(),status:'pendiente'}); save(); }});
  else doPub();
};

/* ======================= MATCH ======================= */
function compat(a,b){
  const ga=new Set(a.genres||[]), gb=new Set(b.genres||[]); const inter=[...ga].filter(x=>gb.has(x)).length; const uni=new Set([...ga,...gb]).size||1;
  const comp=(a.role==='Escritor/a'&&b.role==='Ilustrador/a')||(a.role==='Ilustrador/a'&&b.role==='Escritor/a')?1:(a.role==='Lector/a'||b.role==='Lector/a')?.55:.35;
  const cb=(a.collab||[]).filter(x=>(b.collab||[]).includes(x)).length;
  return Math.min(99,Math.round(28+ (inter/uni)*42 + comp*22 + Math.min(cb,2)*4));
}
function meForMatch(){ return me()||{username:'_guest',role:'Escritor/a',genres:['Fantasía','Misterio','Aventura'],collab:['Portadas']}; }
function matchCandidates(){
  const m=meForMatch(); const mm=S.matches[m.username]||{liked:[],skipped:[],matched:[]}; const f=UI.matchFilters;
  return Object.values(S.users).filter(u=>u.username!==m.username && !u.official && !mm.liked.includes(u.username) && !mm.skipped.includes(u.username)
    && (!f.roles.length||f.roles.includes(u.role)) && (!f.genres.length||(u.genres||[]).some(g=>f.genres.includes(g))) && (!f.collab.length||(u.collab||[]).some(c=>f.collab.includes(c))))
    .map(u=>({u,score:compat(m,u)})).sort((a,b)=>b.score-a.score);
}
function matchCard(c,back){
  const m=meForMatch(); const u=c.u; const shared=(u.genres||[]).filter(g=>(m.genres||[]).includes(g)); const nWorks=S.works.filter(w=>w.author===u.username&&w.status==='publicado').length;
  return `<div class="mcard ${back?'back':''}" ${back?'':`id="topCard" data-u="${u.username}"`}><div class="stamp like">COLABORAR</div><div class="stamp nope">PASAR</div>
    <div class="mtop"><div class="bgart">${bannerSVG(u.banner||u.username)}</div>${avatarHTML(u)}<div class="compat">${icon('sparkles')} ${c.score}% afinidad</div></div>
    <div class="minfo"><div class="row between"><div><div class="h2">${esc(u.name)}</div><div class="small muted">@${esc(u.username)} · ${nWorks} ${nWorks===1?'obra':'obras'}</div></div><span class="tag ${u.role==='Ilustrador/a'?'blue':u.role==='Escritor/a'?'':'green'}">${esc(u.role)}</span></div>

function setupSwipe(){
  const card=$('#topCard'); if(!card) return; let sx=0,sy=0,dx=0,dy=0,drag=false;
  const like=$('.stamp.like',card), nope=$('.stamp.nope',card);
  card.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; drag=true; sx=e.clientX; sy=e.clientY; card.setPointerCapture(e.pointerId); card.style.transition='none'; });
  card.addEventListener('pointermove',e=>{ if(!drag) return; dx=e.clientX-sx; dy=e.clientY-sy; card.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/18}deg)`; like.style.opacity=Math.max(0,Math.min(1,dx/90)); nope.style.opacity=Math.max(0,Math.min(1,-dx/90)); });
  const end=()=>{ if(!drag) return; drag=false; card.style.transition='transform .3s ease'; if(Math.abs(dx)>100) doSwipe(dx>0?1:-1); else if(Math.abs(dx)<6&&Math.abs(dy)<6){ card.style.transform=''; } else { card.style.transform=''; like.style.opacity=0; nope.style.opacity=0; } dx=dy=0; };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}
function doSwipe(dir){
  const card=$('#topCard'); if(!card) return; const u=card.dataset.u;
  if(dir>0 && !S.session){ card.style.transform=''; requireAuth('hacer match'); return; }
  card.style.transition='transform .35s ease, opacity .35s'; card.style.transform=`translate(${dir*600}px,-40px) rotate(${dir*30}deg)`; card.style.opacity='0';
  const m=meForMatch(); const mm=S.matches[m.username]=S.matches[m.username]||{liked:[],skipped:[],matched:[]};
  if(dir>0){ mm.liked.push(u); const t=user(u); const mutual=t.passHash?false:rng(u+m.username)()<(t.likesYou ?? 0.6);
    if(mutual){ mm.matched.push(u); save(); setTimeout(()=>showItsMatch(u),320);
      later(2500,()=>{ const id=chatId(u); if(!S.chats[id]) S.chats[id]={owner:S.session,with:u,unread:true,msgs:[]}; const intro=u==='camila_ilustra'?CHAT_SEED[0].msgs[0].text:`¡Hola! Hicimos match 🙌 Vi tu perfil y creo que podríamos crear algo genial juntos. ¿Qué tienes en mente?`; S.chats[id].msgs.push({from:u,text:intro,t:Date.now()}); S.chats[id].unread=true; save(); notify(S.session,{type:'match',text:`<b>${esc(t.name)}</b> te envió un mensaje`,link:{s:'chat',id:u}}); });
    } else { save(); toast(`💛 Le enviaste tu interés a ${t.name.split(' ')[0]}`); }
  } else { mm.skipped.push(u); UI.lastSkipped.push(u); save(); }

}

A.profileTab=el=>{ UI.profileTab=el.dataset.k; refresh(); };
A.dmUser=el=>{ if(!requireAuth('enviar mensajes')) return; const u=el.dataset.u; const id=chatId(u); if(!S.chats[id]) S.chats[id]={owner:S.session,with:u,unread:false,msgs:[]}; save(); go('chat',{id:u}); };
A.userMenu=el=>{ const u=el.dataset.u; showSheet(`<button class="opt" data-a="shareUser" data-u="${u}">${icon('share')} Compartir perfil</button><button class="opt danger" data-a="report" data-kind="user" data-id="${u}">${icon('flag')} Reportar usuario</button>`); };
A.shareUser=el=>{ const x=user(el.dataset.u); shareText(`${x.name} (@${x.username}) en CHOGGUN`,x.bio||''); };

/* ---------- editar perfil ---------- */
let pedit=null;
SCREENS.editProfile={ noNav:true, render(p){
  const m=me(); if(!pedit||pedit.username!==m.username) pedit=JSON.parse(JSON.stringify(m));
  const e=pedit; const presets=['logo','gato','rana',null];
  return `${topbar({title:p.first?'Completa tu perfil':'Editar perfil',actions:`<button class="btn btn-primary btn-sm" style="margin-right:6px" data-a="saveProfile">Guardar</button>`}).replace('data-a="back"','data-a="cancelProfile"')}
  <div class="scroll"><div class="banner" style="height:110px">${e.bannerImg?`<img src="${e.bannerImg}" alt="">`:bannerSVG(e.banner||e.username)}<button class="btn btn-sm" style="position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff" data-a="newBanner">${icon('refresh')} Fondo</button></div>
  <div class="pad">${p.first?`<div class="banner-tip" style="margin-bottom:16px"><img src="${ASSETS.logo}" alt=""><div class="small">Elige tu avatar y tus géneros favoritos: así Match te sugiere colaboradores con más afinidad.</div></div>`:''}
  <div class="field"><span>Avatar</span><div class="av-pick">${presets.map(a=>`<button class="${(e.avatar||null)===a?'on':''}" data-a="pickAvatar" data-v="${a||''}">${a?`<img src="${ASSETS[a]}" alt="">`:initialsAvatar(e.name,e.username)}</button>`).join('')}${e.avatar&&e.avatar.startsWith('data:')?`<button class="on"><img src="${e.avatar}" alt=""></button>`:''}<button class="up" data-a="uploadAvatar" aria-label="Subir foto">${icon('camera')}</button></div></div>
  <label class="field"><span>Nombre visible</span><input class="input" data-p="name" value="${esc(e.name)}" maxlength="40"></label>
  <label class="field"><span>Biografía <b class="faint" id="bioCount">${(e.bio||'').length}/160</b></span><textarea class="textarea" data-p="bio" maxlength="160" style="min-height:80px" placeholder="Cuéntanos qué creas y qué buscas…">${esc(e.bio||'')}</textarea></label>
  <div class="field"><span>Rol principal</span><div class="chips wrap">${ROLES.map(r=>`<button class="chip ${e.role===r?'on':''}" data-a="pRole" data-v="${r}">${r}</button>`).join('')}</div></div>
  <div class="field"><span>Géneros favoritos</span><div class="chips wrap">${GENRES.map(g=>`<button class="chip ${(e.genres||[]).includes(g)?'on':''}" data-a="pToggle" data-k="genres" data-v="${esc(g)}">${esc(g)}</button>`).join('')}</div></div>
  <div class="field"><span>Tipo de colaboración que buscas</span><div class="chips wrap">${COLLABS.map(c=>`<button class="chip ${(e.collab||[]).includes(c)?'on':''}" data-a="pToggle" data-k="collab" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
  <button class="btn btn-primary btn-block" style="margin-top:6px" data-a="saveProfile">Guardar perfil</button></div></div>`;
} };
document.addEventListener('input',e=>{ const el=e.target; if(el.dataset.p && pedit){ pedit[el.dataset.p]=el.value; if(el.dataset.p==='bio'){ const c=$('#bioCount'); if(c) c.textContent=el.value.length+'/160'; } } });
A.pickAvatar=el=>{ pedit.avatar=el.dataset.v||null; refresh(); };
A.uploadAvatar=async()=>{ const [img]=await pickImages({max:320,quality:.85}); if(img){ pedit.avatar=img; refresh(); } };
A.newBanner=()=>{ pedit.banner=pedit.username+Math.random().toString(36).slice(2,6); pedit.bannerImg=null; refresh(); };
A.pRole=el=>{ pedit.role=el.dataset.v; $$('.chip',el.parentElement).forEach(c=>c.classList.toggle('on',c===el)); };
A.pToggle=el=>{ const arr=pedit[el.dataset.k]=pedit[el.dataset.k]||[]; const v=el.dataset.v; const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); el.classList.toggle('on'); };
A.cancelProfile=()=>{ pedit=null; back(); };
A.saveProfile=()=>{ if(!pedit.name.trim()) return toast('El nombre no puede estar vacío'); if(isToxic(pedit.name+' '+pedit.bio)) return toast('⚠️ Tu perfil contiene lenguaje no permitido');
  const m=me(); ['name','bio','role','genres','collab','avatar','banner','bannerImg'].forEach(k=>m[k]=pedit[k]); m.name=m.name.trim(); pedit=null; save(true); const first=current().params.first; back(); toast(first?'✨ ¡Perfil listo! Prueba la pestaña Match':'✅ Perfil actualizado'); };

/* ======================= AJUSTES ======================= */
SCREENS.settings={ render(){
  const s=S.settings; const m=me();
  const row=(ic,title,sub,act,extra='',right='')=>`<button class="li" ${act?`data-a="${act}"`:''} ${extra}><span class="ic">${icon(ic)}</span><span class="txt"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span>${right||icon('chevR','class="chev"')}</button>`;
  const tog=(k)=>`<span class="toggle ${s[k]?'on':''}"></span>`;
  return `${topbar({title:'Ajustes'})}<div class="scroll"><div class="pad">
  ${m?`<div class="section-label"><span>Cuenta</span></div><div class="list">${row('user','Editar perfil','@'+esc(m.username),'go','data-s="editProfile"')}${row('lock','Cambiar contraseña','','changePw')}${row('mail','Correo',esc(m.email),'')}</div>`:''}
  <div class="section-label"><span>Apariencia</span></div><div class="card" style="padding:14px">
   <div class="field"><span>Tema</span><div class="seg">${[['dark','Oscuro','moon'],['light','Claro','sun'],['system','Sistema','gear']].map(([k,l,ic])=>`<button class="${s.theme===k?'on':''}" data-a="setTheme" data-v="${k}">${icon(ic)} ${l}</button>`).join('')}</div></div>
   <div class="field"><span>Opacidad de publicaciones · <b id="opv">${Math.round(s.cardOpacity*100)}%</b></span><input type="range" min="30" max="100" value="${Math.round(s.cardOpacity*100)}" data-i="cardOpacity"></div>
   <div class="field" style="margin:0"><span>Tamaño de lectura · <b id="rsv2">${s.readerSize}px</b></span><input type="range" min="14" max="26" value="${s.readerSize}" data-i="readerSize2"></div></div>
  <div class="section-label"><span>Preferencias</span></div><div class="list">${row('bell','Notificaciones','Avisos de votos, comentarios y matches','togSetting','data-k="notifications"',tog('notifications'))}${row('eyeOff','Mostrar contenido sensible (+18)','Contenido marcado por sus autores','togSetting','data-k="mature"',tog('mature'))}</div>
  <div class="section-label"><span>Comunidad y seguridad</span></div><div class="list">${row('shield','Normas de la comunidad','Respeto, créditos y derechos de autor','rules')}${m?row('flag','Mis reportes',`${S.reports.filter(r=>r.by===S.session).length} enviados`,'go','data-s="reports" data-mode="mine"'):''}${row('award','Panel de moderación','Revisión humana de reportes (demo)','go','data-s="reports" data-mode="mod"')}</div>
  <div class="section-label"><span>Datos</span></div><div class="list">${m?row('download','Exportar mis datos','Copia tus datos en formato JSON','exportData'):''}${row('refresh','Restablecer datos de demostración','Borra todo lo guardado en este dispositivo','resetAll')}</div>
  <div class="section-label"><span>Acerca de</span></div><div class="card" style="padding:16px;text-align:center"><img src="${ASSETS.logo}" alt="" style="width:76px;height:76px;border-radius:50%;margin:0 auto 8px;border:2px solid var(--gold)"><div class="h2 gold" style="letter-spacing:.12em">CHOGGUN</div><div class="tiny muted">Versión ${APP_VERSION}</div><p class="small" style="margin:10px 0">Plataforma digital colaborativa de contenido literario para escritores, ilustradores y lectores.</p><div class="tiny muted">Semillero SIIANTEC · Tecnólogo en Desarrollo de Software<br>Corporación Tecnológica Industrial Colombiana — TEINCO<br>William Monsalve · Nicolás Arias · Johan Marroquín<br>Bogotá, 2026</div></div>
  ${m?`<button class="btn btn-block" style="margin-top:18px;color:var(--red);border:1.5px solid var(--red)" data-a="logout">${icon('logout')} Cerrar sesión</button>`:`<button class="btn btn-primary btn-block" style="margin-top:18px" data-a="go" data-s="auth" data-mode="login">Iniciar sesión</button>`}
  <div style="height:30px"></div></div></div>`; } };
A.setTheme=el=>{ S.settings.theme=el.dataset.v; save(); refresh(); };
I.cardOpacity=el=>{ S.settings.cardOpacity=el.value/100; $('#opv').textContent=el.value+'%'; applyTheme(); save(); };
I.readerSize2=el=>{ S.settings.readerSize=+el.value; $('#rsv2').textContent=el.value+'px'; save(); };
A.togSetting=el=>{ const k=el.dataset.k; S.settings[k]=!S.settings[k]; save(); refresh(); };
A.changePw=()=>{ showDialog({title:'Cambiar contraseña',html:`<input class="input" type="password" id="pw0" placeholder="Contraseña actual" style="margin-top:10px"><input class="input" type="password" id="pw1" placeholder="Nueva contraseña" style="margin-top:8px"><div class="err" id="pwErr"></div>`,ok:'Cambiar'}); $('#overlay [data-a=dialogOk]').dataset.a='pwOk'; };
A.pwOk=()=>{ const m=me(); const a=$('#pw0').value, b=$('#pw1').value; const err=$('#pwErr');
  if(m.passHash!==pwHash(a)) return err.textContent='La contraseña actual no es correcta'; if(b.length<6||!/[a-z]/.test(b)||!/\d/.test(b)) return err.textContent='Mínimo 6 caracteres, un número y una minúscula';
  m.passHash=pwHash(b); save(true); closeOverlay(); toast('🔒 Contraseña actualizada'); };
A.rules=()=>showSheet(`<div style="padding:0 18px 10px" class="stack small">${[['🤝','Respeto ante todo','Critica la obra, no a la persona. El feedback debe ser constructivo.'],['✍️','Da crédito siempre','Si colaboras, registra a todos en Créditos. Nada de apropiarse del trabajo ajeno.'],['©️','Respeta los derechos de autor','Publica solo contenido propio o con permiso. El plagio se retira.'],['🔞','Etiqueta el contenido sensible','Marca como +18 cualquier contenido sexual o violencia gráfica.'],['🚫','Cero acoso y spam','El acoso, discurso de odio y la publicidad no solicitada están prohibidos.'],['🛡️','Reporta lo que veas mal','Usa “Reportar”: la moderación combina detección automática y revisión humana.']].map(([e,t,d])=>`<div class="row" style="align-items:flex-start"><span style="font-size:24px">${e}</span><div><b>${t}</b><div class="muted">${d}</div></div></div>`).join('')}</div>`,'Normas de la comunidad');
A.exportData=()=>{ const m=me(); const data={perfil:{...m,passHash:undefined},obras:S.works.filter(w=>w.author===m.username),guardados:S.saved[m.username]||[],comunidades:S.joined[m.username]||[],historial:S.history[m.username]||{}};
  const json=JSON.stringify(data,null,2);
  navigator.clipboard.writeText(json).then(()=>toast('📋 Tus datos (JSON) se copiaron al portapapeles')).catch(()=>shareText('Mis datos de CHOGGUN',json)); };
A.resetAll=()=>showDialog({title:'¿Restablecer todo?',text:'Se borrarán las cuentas, publicaciones y ajustes guardados en este dispositivo y se cargarán los datos de demostración.',ok:'Restablecer',danger:true,onOk:()=>{ try{ localStorage.removeItem(KEY); }catch(e){} S=defaultState(); S.settings.onboarded=true; save(true); stack=[{name:'auth',params:{mode:'login',first:true}}]; render(); toast('Datos restablecidos'); }});
A.logout=()=>showDialog({title:'¿Cerrar sesión?',text:'Podrás volver a entrar cuando quieras.',ok:'Cerrar sesión',danger:true,onOk:()=>{ S.session=null; save(true); stack=[{name:'auth',params:{mode:'login',first:true}}]; render(); toast('👋 Sesión cerrada'); }});

/* ======================= REPORTES / MODERACIÓN ======================= */
function reportTarget(r){
  if(r.kind==='work'){ const w=work(r.id); return w?`${FORMATS[w.type].emoji} “${esc(w.title)}” de ${esc(user(w.author).name)}`:'Obra eliminada'; }
  if(r.kind==='comment'){ const w=work(r.parent); let c=null; if(w){ for(const x of w.comments){ if(x.id===r.id) c=x; for(const y of (x.replies||[])) if(y.id===r.id) c=y; } } return c?`💬 Comentario de ${esc(user(c.user).name)}: “${esc(c.text.slice(0,80))}”`:'Comentario eliminado'; }
  return `👤 Usuario @${esc(r.id)}`;
}
SCREENS.reports={ render(p){
  const mod=p.mode==='mod'; const list=mod?S.reports:S.reports.filter(r=>r.by===S.session);
  const st={pendiente:['Pendiente',''],retirado:['Contenido retirado','red'],descartado:['Descartado','gray']};
  return `${topbar({title:mod?'Moderación':'Mis reportes'})}<div class="scroll"><div class="pad">${mod?`<div class="mod-flag" style="margin-bottom:14px;background:rgba(155,124,240,.1);border-color:rgba(155,124,240,.3);color:var(--purple)">${icon('shield')}<span>Panel de revisión humana. Los reportes llegan de la comunidad y del filtro automático de lenguaje (simulación de Perspective API).</span></div>`:''}
  ${list.length?list.map(r=>`<div class="card" style="padding:14px;margin-bottom:10px"><div class="row between"><span class="tag ${st[r.status][1]}">${st[r.status][0]}</span><span class="tiny faint">${timeAgo(r.t)}</span></div><p style="margin:8px 0 4px;font-weight:700">${reportTarget(r)}</p><div class="small muted">Motivo: ${esc(r.reason)}${r.note&&r.by!=='sistema'?` · “${esc(r.note)}”`:''}</div><div class="tiny faint" style="margin-top:3px">Reportado por: ${r.by==='sistema'?'🤖 Detección automática':esc(r.by===S.session?'ti':'@'+r.by)}</div>
  ${mod&&r.status==='pendiente'?`<div class="row" style="margin-top:10px"><button class="btn btn-sm btn-red grow" data-a="modAct" data-id="${r.rid}" data-v="retirado">${icon('ban')} Retirar</button><button class="btn btn-sm btn-ghost grow" data-a="modAct" data-id="${r.rid}" data-v="descartado">${icon('check')} Descartar</button>${r.kind==='work'?`<button class="btn btn-sm btn-ghost" data-a="open" data-id="${r.id}">${icon('eye')}</button>`:''}</div>`:''}</div>`).join(''):emptyHTML('🛡️',mod?'Sin reportes pendientes':'No has enviado reportes','Gracias por ayudar a mantener CHOGGUN como un espacio seguro.')}</div></div>`; } };
A.modAct=el=>{ const r=S.reports.find(x=>x.rid===el.dataset.id); r.status=el.dataset.v;
  if(r.status==='retirado'){ if(r.kind==='work'){ const w=work(r.id); if(w){ w.removed=true; notify(w.author,{type:'mod',text:`Moderación retiró “${esc(w.title)}” por: ${esc(r.reason)}`}); } }
    if(r.kind==='comment'){ const w=work(r.parent); if(w) w.comments.forEach(c=>{ if(c.id===r.id) c.removed=true; (c.replies||[]).forEach(y=>{ if(y.id===r.id) y.removed=true; }); }); } }
  S.reports.filter(x=>x.rid!==r.rid&&x.kind===r.kind&&x.id===r.id&&x.status==='pendiente').forEach(x=>x.status=r.status);
  if(r.by&&r.by!=='sistema') notify(r.by,{type:'mod',text:`Tu reporte fue revisado: <b>${r.status==='retirado'?'contenido retirado':'sin infracción'}</b>. ¡Gracias!`,link:{s:'reports',mode:'mine'}});
  save(); refresh(); toast(r.status==='retirado'?'Contenido retirado':'Reporte descartado'); };

/* ======================= EVENTOS GLOBALES ======================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a; if(a==='overlayBg' && e.target!==el) return;
  if(A[a]){ e.preventDefault(); e.stopPropagation(); try{ A[a](el,e); }catch(err){ console.error(err); toast('Ups, algo salió mal'); } }
});
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-f]'); if(!f) return; e.preventDefault(); if(F[f.dataset.f]) F[f.dataset.f](f); });
document.addEventListener('input',e=>{ if(e.target.matches('.composer textarea')){ const t=e.target; t.style.height='auto'; t.style.height=Math.min(110,t.scrollHeight)+'px'; } });

function handleBack(){ return back(); }
window.addEventListener('popstate',()=>{ const handled=handleBack(); if(handled) history.pushState({c:1},''); });

/* ======================= INICIO ======================= */
function boot(){
  load(); applyTheme();
  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{ if(S.settings.theme==='system') applyTheme(); });
  if(!S.settings.onboarded) stack=[{name:'onboarding',params:{i:0}}];
  else if(!S.session) stack=[{name:'auth',params:{mode:'login',first:true}}];
  else stack=[{name:'home',params:{}}];
  render();
  try{ history.pushState({c:1},''); }catch(e){}
  const sp=$('#splash'); setTimeout(()=>{ sp.style.opacity='0'; setTimeout(()=>sp.remove(),400); },1300);
  try{ window.Capacitor?.Plugins?.SplashScreen?.hide(); }catch(e){}
  try{ const App=window.Capacitor?.Plugins?.App; if(App) App.addListener('backButton',()=>{ if(!handleBack()) App.exitApp(); }); }catch(e){}
  window.addEventListener('beforeunload',()=>save(true));
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(true); });
}
boot();

</script>
</body>
</html>
